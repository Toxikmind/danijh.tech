<style>

  :root {
    --bg: #080c10; --card: #0f1923; --border: #1e3a4a;
    --accent: #00d4ff; --accent2: #00ff9d; --accent3: #ff6b35;
    --text: #ccd6f6; --text-dim: #7a8fa6;
    --mono: 'Share Tech Mono', monospace; --sans: 'Syne', sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; }
  body::before {
    content: ''; position: fixed; inset: 0;
    background-image: linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,212,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px; pointer-events: none; z-index: 0;
  }
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 48px; background: rgba(8,12,16,0.9);
    backdrop-filter: blur(20px); border-bottom: 1px solid var(--border);
  }
  .nav-logo { font-family: var(--mono); color: var(--accent); font-size: 14px; letter-spacing: 2px; text-decoration: none; }
  .nav-back { font-family: var(--mono); font-size: 12px; color: var(--text-dim); text-decoration: none; letter-spacing: 2px; transition: color 0.2s; display: flex; align-items: center; gap: 8px; }
  .nav-back:hover { color: var(--accent); }

  .hero { position: relative; z-index: 1; padding: 130px 48px 40px; max-width: 900px; margin: 0 auto; }
  .hero-tag { font-family: var(--mono); font-size: 12px; color: var(--accent); letter-spacing: 4px; margin-bottom: 16px; }
  .hero-title { font-size: clamp(32px, 5vw, 64px); font-weight: 800; letter-spacing: -2px; margin-bottom: 16px;
    background: linear-gradient(135deg, #fff 0%, var(--accent) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .content { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 0 48px 80px; }
  .cert-grid { display: grid; grid-template-columns: 200px 1fr; gap: 40px; align-items: start; margin-bottom: 48px; }
  .cert-logo { width: 100%; border-radius: 12px; }
  .cert-meta { display: flex; flex-direction: column; gap: 16px; }
  .meta-item label { font-family: var(--mono); font-size: 10px; color: var(--accent); letter-spacing: 3px; display: block; margin-bottom: 4px; }
  .meta-item span { font-size: 16px; font-weight: 700; color: #fff; }
  .meta-item a { font-family: var(--mono); font-size: 13px; color: var(--accent2); text-decoration: none; }
  .meta-item a:hover { text-decoration: underline; }
  .code-block { background: #060a0e; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin: 32px 0; }
  .code-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 18px;
    background: rgba(0,212,255,0.04); border-bottom: 1px solid var(--border); }
  .code-label { font-family: var(--mono); font-size: 11px; color: var(--accent); letter-spacing: 2px; }
  .copy-btn { font-family: var(--mono); font-size: 11px; color: var(--text-dim); background: none;
    border: 1px solid var(--border); border-radius: 3px; padding: 3px 10px; cursor: pointer; transition: all 0.2s; }
  .copy-btn:hover { color: var(--accent); border-color: var(--accent); }
  pre { padding: 16px 24px; font-family: var(--mono); font-size: 13px; color: #00ff9d; }
  .cert-viewer { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 0 48px 32px; }
  .viewer-label { font-family: var(--mono); font-size: 11px; color: var(--accent); letter-spacing: 3px; margin-bottom: 16px; }
  iframe { width: 100%; height: 620px; border: 1px solid var(--border); border-radius: 8px; background: #fff; }
  .page-nav { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    padding: 32px 48px 80px; max-width: 900px; margin: 0 auto; border-top: 1px solid var(--border); }
  .page-nav a { font-family: var(--mono); font-size: 12px; color: var(--text-dim); text-decoration: none;
    border: 1px solid var(--border); border-radius: 4px; padding: 12px 20px; letter-spacing: 2px; transition: all 0.2s; }
  .page-nav a:hover { color: var(--accent); border-color: var(--accent); background: rgba(0,212,255,0.05); }
  @media (max-width: 768px) {
    nav { padding: 16px 24px; }
    .hero, .content, .cert-viewer, .page-nav { padding-left: 24px; padding-right: 24px; }
    .cert-grid { grid-template-columns: 1fr; }
    .cert-logo { max-width: 180px; }
  }
</style>
